name: CI_Workflow

on:
  push:
    branches: [ "test/ec2test" ]

jobs:
  build:
    runs-on: ubuntu-latest # 실행환경 설정

    steps: # job내에서 실행 단계
      - uses: actions/checkout@v3 # 현재 레포의 코드르 락져옴
      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew clean build

      - name: 커밋 해시태그 설정
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t myapp:$IMAGE_TAG .