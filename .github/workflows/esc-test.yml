name: Build & Push to ECS

on:
  push:
    branches: [ "test/ec2test" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v3

      # JDK 설정
      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3) Gradle 캐시 (선택)
      - name: Gradle 캐시 (선택)
        uses: gradle/actions/setup-gradle@v3

      # gradlew 실행 권한 설정
      - name: Grant execute permission
        run: chmod +x gradlew

      # 빌드
      - name: Build JAR
        run: ./gradlew clean bootJar

      # AWS 자격 정보 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR 로그인(도커에서 ECR로 푸시하는 권한을 가져와야 함)
      # 도커 이미지 빌드, 이미지 태그 변경(ECR설정에 맞게), 이미지 ECR로 푸시

      # 3) ECR 로그인 (계정 ID를 Secret에서 참조)
      - name: ECR Login
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # (선택) 이미지 태그 구성: 커밋 해시 7자리 + latest
      - name: Prepare tags
        id: prep
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "REPO_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-demo-repo-1" >> $GITHUB_ENV

      # 4) Docker 빌드
      - name: Docker build
        run: |
          docker build -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .

      # 5) ECR 푸시
      - name: Docker push
        run: |
          docker push "$REPO_URI:$IMAGE_TAG"
          docker push "$REPO_URI:latest"

      #      # 7) buildx 설정
      #      - name: Set up Docker Buildx
      #        uses: docker/setup-buildx-action@v3
      #
      #      # 9) buildx로 빌드 + push ⭐
      #      - name: Build and Push
      #        run: |
      #          docker buildx build \
      #            --platform linux/amd64 \
      #            -t "$REPO_URI:$IMAGE_TAG" \
      #            -t "$REPO_URI:latest" \
      #            --push \
      #            .
      # 10) 작업 정의 템플릿 렌더링 (envsubst로 변수 치환)
      #     - ecs-task-def.json 내 ${AWS_ACCOUNT_ID}, ${AWS_REGION}, ${IMAGE_TAG} 치환
      - name: Render task definition
        run: |
          sudo apt-get update -y && sudo apt-get install -y gettext-base
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export AWS_REGION=${{ secrets.AWS_REGION }}
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          export DB_NAME=${{ secrets.DB_NAME }}
          export DB_USER=${{ secrets.DB_USER }}
          export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          export AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
          envsubst < ecs-task-def.json > task-def.rendered.json
          echo "=== Rendered task def ==="
          cat task-def.rendered.json

      # 11) 작업 정의 업데이트 (새 리비전 등록)
      #      - name: 작업 정의 업데이트
      #        run: |
      #          aws ecs register-task-definition \
      #            --cli-input-json file://task-def.rendered.json
      - name: 새로운 작업 정의 등록
        id: register task definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      # 12) ECS 서비스 업데이트 (새 작업 정의 강제 배포)
      - name: ECS 서비스 업데이트
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

      # 13) 배포 완료 대기 (서비스가 안정 상태가 될 때까지)
      #      - name: ECS 배포 완료 대기
      #        run: |
      #          aws ecs wait services-stable \
      #            --cluster ${{ secrets.ECS_CLUSTER }} \
      #            --services ${{ secrets.ECS_SERVICE }}

      # 14) 배포 상태 확인 (디플로이먼트 요약 출력)
      - name: ECS 배포 상태 확인
        run: |
          aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} \
            --query "services[0].deployments"